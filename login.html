<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="stylelogin.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Cinebox</title>
  </head>
  <body>
    <main class="login-box">
      <h2>Iniciar sesión</h2>
      <form id="login-form">
        <input type="text" id="username" placeholder="Usuario" autocomplete="username" required>
        <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="submit">Iniciar sesión</button>
      </form>
      <a href="register.html">Crear una cuenta</a>
      <p><a class="auth-home-link" href="index.html">Volver al inicio</a></p>
      <p class="message" id="message" aria-live="polite"></p>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
