<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar películas - Cinebox</title>
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="pagina-resultados">
  <header class="cabecera-sitio">
    <a class="marca-sitio" href="index.html">Cinebox</a>
    <nav class="navegacion-sitio" aria-label="Navegación principal">
      <label class="etiqueta-navegacion" for="busqueda-peliculas">Buscar película</label>
      <form action="resultados.html" method="GET" class="busqueda-sitio">
        <input id="busqueda-peliculas" type="search" name="q" placeholder="Buscar..." aria-label="Buscar película" required>
        <button type="submit">Buscar</button>
      </form>
      <a class="boton-inicio" href="index.html">Inicio</a>
      <ul class="menu-sitio">
        <li><a href="notificaciones.html">Notificaciones</a></li>
        <li><a href="amigos.html">Amigos</a></li>
      </ul>
      <div class="botones-acceso-sitio" data-auth-controls>
        <span class="etiqueta-navegacion">Identifícate</span>
        <a href="login.html">Iniciar sesión</a>
        <a href="register.html">Registrarse</a>
      </div>
      <a class="usuario-sesion-sitio" data-auth-user href="perfil.html" hidden></a>
      <button class="cerrar-sesion-sitio" data-auth-logout type="button" hidden>Cerrar sesión</button>
    </nav>
  </header>

  <main class="contenido-resultados">
    <h1 id="titulo-resultados">Resultados de búsqueda</h1>
    <div class="controles-resultados" aria-label="Filtrar y ordenar resultados">
      <label>
        Ordenar:
        <select id="orden-resultados">
          <option value="mejor">Mejor valoradas</option>
          <option value="peor">Peor valoradas</option>
          <option value="alfabetico">Orden alfabético</option>
        </select>
      </label>
      <label>
        Género:
        <select id="filtro-genero">
          <option value="todos">Todos</option>
          <option value="acción">Acción</option>
          <option value="animación">Animación</option>
          <option value="aventura">Aventura</option>
          <option value="ciencia ficción">Ciencia ficción</option>
          <option value="comedia">Comedia</option>
          <option value="crimen">Crimen</option>
          <option value="deportes">Deportes</option>
          <option value="drama">Drama</option>
          <option value="historia">Historia</option>
        </select>
      </label>
    </div>
    <section id="resultados-peliculas" class="resultados-peliculas" aria-live="polite"></section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/busqueda.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
