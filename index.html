<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cinebox</title>
  <link rel="stylesheet" href="styleindex.css">
</head>
<body class="pagina-principal">
  <h1 class="titulo-pagina">Cinebox</h1>

<header class="barra-principal">
  <nav class="navegacion">
    <span class="titulo">Buscar película</span>
    <form action="login.html" method="GET" class="seccion-buscar">
      <input type="search" name="q" placeholder="Buscar...">
      <button type="submit">Buscar</button>
    </form>

    <span class="Titulo">Perfil</span>
    <ul class="menu-navegacion">
      <li><a href="notificaciones.html">Notificaciones</a></li>
      <li><a href="vistas.html">Películas vistas</a></li>
      <li><a href="watchlist.html">Watchlist</a></li>
      <li><a href="amigos.html">Amigos</a></li>
    </ul>
    
    <div class="botones-acceso">
      <span class="Titulo">Identifícate</span>
      <a href="login.html" class="btn-login">Iniciar sesión</a>
      <a href="register.html" class="btn-registro">Registrarse</a>
    </div>

  </nav>
</header>

<main class="contenedor-principal">

  <section class="seccion-populares">
    <h2>Películas populares esta semana</h2>
    
<div class="carrusel-peliculas" x-data="cinebox()">

    <template x-for="pelicula in peliculas" :key="pelicula.id">
        <article class="tarjeta-pelicula">
            <h3 x-text="pelicula.titulo"></h3>

            <img
                :src="pelicula.poster"
                :alt="'Póster de ' + pelicula.titulo"
            >

            <p class="puntuacion" x-text="pelicula.puntuacion"></p>
        </article>
    </template>

</div>
  </section>

  <aside class="actividad-amigos">
    <h2>Actividad de tus amigos</h2>
  </aside>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="script.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>


</body>
</html>
