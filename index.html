<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinebox</title>
  <link rel="stylesheet" href="css/styleindex.css">
  <link rel="stylesheet" href="css/header.css">
</head>
<body class="pagina-principal">
  <header class="cabecera-sitio">
    <a class="marca-sitio" href="index.html">Cinebox</a>
    <nav class="navegacion-sitio" aria-label="Navegación principal">
      <span class="etiqueta-navegacion">Buscar película</span>
      <form action="resultados.html" method="GET" class="busqueda-sitio">
        <input type="search" name="q" placeholder="Buscar..." aria-label="Buscar película">
        <button type="submit">Buscar</button>
      </form>

      <a class="boton-inicio" href="index.html" aria-current="page">Inicio</a>
      <ul class="menu-sitio">
        <li><a href="notificaciones.html">Notificaciones</a></li>
        <li><a href="amigos.html">Amigos</a></li>
      </ul>

      <div class="botones-acceso-sitio" data-auth-controls>
        <span class="etiqueta-navegacion">Identifícate</span>
        <a href="login.html">Iniciar sesión</a>
        <a href="register.html">Registrarse</a>
      </div>
      <a class="usuario-sesion-sitio" data-auth-user href="perfil.html" hidden></a>
    </nav>
  </header>

<main class="contenedor-principal">

  <section class="seccion-populares">
    <h2>Películas populares esta semana</h2>
    
<div class="carrusel-peliculas" x-data="cinebox()" x-cloak>
    <p x-show="cargando" class="estado-interfaz">Cargando películas...</p>

    <div x-show="error" class="estado-interfaz estado-error">
      <p x-text="mensaje"></p>
      <button type="button" @click="cargarPeliculas()">Reintentar</button>
    </div>

    <p x-show="!cargando && !error && peliculas.length === 0" class="estado-interfaz" x-text="mensaje"></p>

    <template x-for="pelicula in peliculas" :key="pelicula.id">
        <article class="tarjeta-pelicula" x-show="!cargando && !error">
            <a class="enlace-pelicula" :href="'pelicula.html?id=' + pelicula.id">
            <h3 x-text="pelicula.titulo"></h3>

            <img
                :src="pelicula.poster"
                :alt="'Póster de ' + pelicula.titulo"
            >

            <p class="puntuacion" x-text="pelicula.puntuacion"></p>
            </a>
        </article>
    </template>

</div>
  </section>

  <aside class="actividad-amigos">
    <h2>Actividad de tus amigos</h2>
    <article class="publicacion-amigo">
      <a class="enlace-pelicula" href="pelicula.html?id=3">
        <img
          class="poster-actividad"
          src="posterfiesta.png"
          alt="Póster de La fiesta de las salchichas"
        >
        <div class="pie-publicacion">
          <div class="autor-publicacion">
            <img src="posters/posterfiesta.png" alt="" class="avatar-publicacion">
            <span>chuyete</span>
          </div>
          <p class="puntuacion-publicacion">4/5</p>
        </div>
      </a>
    </article>
  </aside>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/script.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>


</body>
</html>
