<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Películas vistas</title>
	<style>
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background: #f5f5f5;
			color: #222;
		}

		main {
			max-width: 900px;
			margin: 40px auto;
			padding: 0 20px;
		}

		h1 {
			margin-bottom: 24px;
			font-size: 36px;
		}

		.peliculas-vistas {
			display: flex;
			flex-wrap: wrap;
			gap: 24px;
		}

		.pelicula {
			width: 180px;
			text-align: center;
		}

		.pelicula h2 {
			margin: 0 0 12px;
			font-size: 18px;
			font-weight: 600;
		}

		.pelicula img {
			display: block;
			width: 100%;
			height: 230px;
			object-fit: cover;
			border-radius: 8px;
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
		}

		.puntuacion {
			margin: 10px 0 0;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<main>
		<h1>Películas vistas</h1>

		<section class="peliculas-vistas">
			<article class="pelicula">
				<h2>F1</h2>
				<img src="posterf1.png" alt="Poster F1">
				<p class="puntuacion">Puntuación: 4.0</p>
			</article>

			<article class="pelicula">
				<h2>Superman</h2>
				<img src="postersuperman.png" alt="Poster Superman">
				<p class="puntuacion">Puntuación: 3.5</p>
			</article>
		</section>
	</main>
</body>
</html>
