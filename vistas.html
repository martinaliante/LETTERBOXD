<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Películas vistas</title>
	<link rel="stylesheet" href="css/header.css">
	<style>
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background: #f5f5f5;
			color: #222;
		}

		* {
			box-sizing: border-box;
		}

		main {
			max-width: 900px;
			margin: 40px auto;
			padding: 0 clamp(16px, 4vw, 20px);
		}

		h1 {
			margin-bottom: 24px;
			font-size: clamp(28px, 5vw, 36px);
		}

		.peliculas-vistas {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 180px));
			justify-content: center;
			gap: 24px;
		}

		.pelicula {
			width: 100%;
			text-align: center;
		}

		.pelicula h2 {
			margin: 0 0 12px;
			font-size: 18px;
			font-weight: 600;
		}

		.pelicula img {
			display: block;
			width: 100%;
			aspect-ratio: 2 / 3;
			object-fit: cover;
			border-radius: 8px;
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
		}

		.puntuacion {
			margin: 10px 0 0;
			font-weight: bold;
		}

		@media (max-width: 480px) {
			main {
				margin: 24px auto;
			}

			.peliculas-vistas {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 16px;
			}
		}

		@media (max-width: 320px) {
			.peliculas-vistas {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<header class="cabecera-sitio">
		<a class="marca-sitio" href="index.html">Cinebox</a>
		<nav class="navegacion-sitio" aria-label="Navegación principal">
			<span class="etiqueta-navegacion">Buscar película</span>
			<form action="resultados.html" method="GET" class="busqueda-sitio">
				<input type="search" name="q" placeholder="Buscar..." aria-label="Buscar película">
				<button type="submit">Buscar</button>
			</form>
			<a class="boton-inicio" href="index.html">Inicio</a>
			<ul class="menu-sitio">
				<li><a href="notificaciones.html">Notificaciones</a></li>
				<li><a href="vistas.html" aria-current="page">Películas vistas</a></li>
				<li><a href="watchlist.html">Watchlist</a></li>
				<li><a href="amigos.html">Amigos</a></li>
			</ul>
			<div class="botones-acceso-sitio" data-auth-controls>
				<span class="etiqueta-navegacion">Identifícate</span>
				<a href="login.html">Iniciar sesión</a>
				<a href="register.html">Registrarse</a>
			</div>
			<span class="usuario-sesion-sitio" data-auth-user hidden></span>
		</nav>
	</header>
	<main>
		<h1>Películas vistas</h1>

		<section class="peliculas-vistas">
			<article class="pelicula">
				<a href="pelicula.html?id=4" style="color: inherit; text-decoration: none;">
					<h2>F1</h2>
					<img src="posterf1.png" alt="Póster F1">
					<p class="puntuacion">Puntuación: 4.0</p>
				</a>
			</article>

			<article class="pelicula">
				<a href="pelicula.html?id=5" style="color: inherit; text-decoration: none;">
					<h2>Superman</h2>
					<img src="postersuperman.png" alt="Póster Superman">
					<p class="puntuacion">Puntuación: 3.5</p>
				</a>
			</article>
		</section>
	</main>
	<script src="js/script.js"></script>
</body>
</html>
