<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="stylelogin.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen</title>
  </head>
  <body>
    <div class="register-box">
        <h2>Registrarse</h2>
        <input type="text" id="create username" placeholder="Crear usuario" required>
        <input type="password" id="create password" placeholder="Crear contraseña" required>
      <input type="password" id="repeat password" placeholder="Repetir contraseña" required>
        <button onclick="register()"> Registrarse</button>
        <p class="message" id="message"></p>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
