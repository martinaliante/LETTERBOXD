<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notificaciones</title>
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="pagina-notificaciones">
  <header class="cabecera-sitio">
    <a class="marca-sitio" href="index.html">Cinebox</a>
    
<nav class="navegacion-sitio" aria-label="Navegación principal">
  <button
    class="boton-menu-movil"
    type="button"
    aria-label="Abrir menú de navegación"
    aria-expanded="false"
    aria-controls="menu-desplegable"
  >
    ☰
  </button>

  <div class="contenido-menu-movil" id="menu-desplegable">
    <label class="etiqueta-navegacion" for="busqueda-peliculas">
      Buscar película
    </label>

    <form action="resultados.html" method="GET" class="busqueda-sitio">
      <input
        id="busqueda-peliculas"
        type="search"
        name="q"
        placeholder="Buscar..."
        aria-label="Buscar película"
      >
      <button type="submit">Buscar</button>
    </form>

    <a class="boton-inicio" href="index.html">Inicio</a>

    <ul class="menu-sitio">
      <li><a href="notificaciones.html" aria-current="page">Notificaciones</a></li>
      <li><a href="amigos.html">Amigos</a></li>
    </ul>

    <div class="botones-acceso-sitio" data-auth-controls>
      <span class="etiqueta-navegacion">Identifícate</span>
      <a href="login.html">Iniciar sesión</a>
      <a href="register.html">Registrarse</a>
    </div>

    <a class="usuario-sesion-sitio" data-auth-user href="perfil.html" hidden></a>

    <button class="cerrar-sesion-sitio" data-auth-logout type="button" hidden>
      Cerrar sesión
    </button>
  </div>
</nav>

  </header>
  <main class="contenido-notificaciones">
    <h1>Notificaciones</h1>
    <ul id="lista-notificaciones" class="lista-notificaciones" aria-live="polite">
      <li class="item-notificacion">
        <p class="estado-interfaz">Cargando actividad...</p>
      </li>
    </ul>
  </main>
  <script src="js/api.js"></script>
  <script src="js/comunidad.js"></script>
  <script src="js/script.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
