<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Amigos</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    main {
      max-width: 300px;
      margin: 40px auto;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 32px;
    }

    .avatar-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .avatar-block img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      border: 4px solid #ddd;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .usuario {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
      color: #222;
    }
  </style>
</head>
<body>
  <main>
    <h1>Amigos</h1>
    <div class="avatar-block">
      <img src="fotochuyete.png" alt="Foto chuyete">
      <p class="usuario">chuyete</p>
    </div>
  </main>
</body>
</html>
