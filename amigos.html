<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amigos</title>
  <link rel="stylesheet" href="css/header.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    main {
      width: min(calc(100% - 32px), 300px);
      margin: 40px auto;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 32px;
    }

    .avatar-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .avatar-block img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      border: 4px solid #ddd;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .usuario {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
      color: #222;
    }

    .estado-interfaz {
      padding: 16px;
      color: #444;
    }

    .estado-error {
      color: #b42318;
    }

    .estado-interfaz button {
      display: block;
      margin: 12px auto 0;
      padding: 9px 14px;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      main {
        margin-top: 24px;
      }

      .avatar-block img {
        width: min(180px, 60vw);
        height: auto;
        aspect-ratio: 1;
      }
    }
  </style>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <header class="cabecera-sitio">
    <a class="marca-sitio" href="index.html">Cinebox</a>
    <nav class="navegacion-sitio" aria-label="Navegación principal">
      <label class="etiqueta-navegacion" for="busqueda-peliculas">Buscar película</label>
      <form action="resultados.html" method="GET" class="busqueda-sitio">
        <input id="busqueda-peliculas" type="search" name="q" placeholder="Buscar..." aria-label="Buscar película">
        <button type="submit">Buscar</button>
      </form>
      <a class="boton-inicio" href="index.html">Inicio</a>
      <ul class="menu-sitio">
        <li><a href="notificaciones.html">Notificaciones</a></li>
        <li><a href="amigos.html" aria-current="page">Amigos</a></li>
      </ul>
      <div class="botones-acceso-sitio" data-auth-controls>
        <span class="etiqueta-navegacion">Identifícate</span>
        <a href="login.html">Iniciar sesión</a>
        <a href="register.html">Registrarse</a>
      </div>
      <a class="usuario-sesion-sitio" data-auth-user href="perfil.html" hidden></a>
    </nav>
  </header>
  <main>
    <h1>Amigos</h1>
    <div id="lista-amigos" aria-live="polite">
      <p class="estado-interfaz">Cargando amigos...</p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/comunidad.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
