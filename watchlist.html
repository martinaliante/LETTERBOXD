<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Watchlist</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 24px;
      font-size: 36px;
      text-align: left;
    }

    .watchlist {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }

    .pelicula {
      width: 180px;
      text-align: center;
    }

    .pelicula img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .pelicula h2 {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Watchlist</h1>

    <section class="watchlist">
      <article class="pelicula">
        <img src="posterhrek.png" alt="Poster Shrek">
        <h2>Shrek</h2>
      </article>

      <article class="pelicula">
        <img src="posteroppenheimer.png" alt="Poster Oppenheimer">
        <h2>Oppenheimer</h2>
      </article>

    </section>
  </main>
</body>
</html>
