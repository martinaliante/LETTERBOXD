<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchlist</title>
  <link rel="stylesheet" href="css/header.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 clamp(16px, 4vw, 20px);
    }

    h1 {
      margin-bottom: 24px;
      font-size: clamp(28px, 5vw, 36px);
      text-align: left;
    }

    .watchlist {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 180px));
      justify-content: center;
      gap: 24px;
    }

    .pelicula {
      width: 100%;
      text-align: center;
    }

    .pelicula img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .pelicula h2 {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      main {
        margin: 24px auto;
      }

      .watchlist {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
    }

    @media (max-width: 320px) {
      .watchlist {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="cabecera-sitio">
    <a class="marca-sitio" href="index.html">Cinebox</a>
    <nav class="navegacion-sitio" aria-label="Navegación principal">
      <span class="etiqueta-navegacion">Buscar película</span>
      <form action="resultados.html" method="GET" class="busqueda-sitio">
        <input type="search" name="q" placeholder="Buscar..." aria-label="Buscar película">
        <button type="submit">Buscar</button>
      </form>
      <a class="boton-inicio" href="index.html">Inicio</a>
      <ul class="menu-sitio">
        <li><a href="notificaciones.html">Notificaciones</a></li>
        <li><a href="vistas.html">Películas vistas</a></li>
        <li><a href="watchlist.html" aria-current="page">Watchlist</a></li>
        <li><a href="amigos.html">Amigos</a></li>
      </ul>
      <div class="botones-acceso-sitio" data-auth-controls>
        <span class="etiqueta-navegacion">Identifícate</span>
        <a href="login.html">Iniciar sesión</a>
        <a href="register.html">Registrarse</a>
      </div>
      <span class="usuario-sesion-sitio" data-auth-user hidden></span>
    </nav>
  </header>
  <main>
    <h1>Watchlist</h1>

    <section class="watchlist" id="watchlist-peliculas">
    </section>
    <p id="watchlist-estado" class="estado-interfaz" aria-live="polite"></p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/watchlist.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
