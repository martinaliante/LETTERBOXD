<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Película - Cinebox</title>
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="pagina-pelicula min-h-screen bg-gray-100">
  <header class="cabecera-sitio">
    <a class="marca-sitio" href="index.html">Cinebox</a>
    <nav class="navegacion-sitio" aria-label="Navegación principal">
      <label class="etiqueta-navegacion" for="busqueda-peliculas">Buscar película</label>
      <form action="resultados.html" method="GET" class="busqueda-sitio">
        <input id="busqueda-peliculas" type="search" name="q" placeholder="Buscar..." aria-label="Buscar película" required>
        <button type="submit">Buscar</button>
      </form>
      <a class="boton-inicio" href="index.html">Inicio</a>
      <ul class="menu-sitio">
        <li><a href="notificaciones.html">Notificaciones</a></li>
        <li><a href="amigos.html">Amigos</a></li>
      </ul>
      <div class="botones-acceso-sitio" data-auth-controls>
        <span class="etiqueta-navegacion">Identifícate</span>
        <a href="login.html">Iniciar sesión</a>
        <a href="register.html">Registrarse</a>
      </div>
      <a class="usuario-sesion-sitio" data-auth-user href="perfil.html" hidden></a>
    </nav>
  </header>

  <main class="mx-auto my-8 w-[min(100%-2rem,1000px)]">
    <p id="mensaje-pelicula" class="min-h-6 text-green-700" aria-live="polite"></p>
    <section id="detalle-pelicula" class="grid gap-8 rounded-xl bg-white p-5 shadow-md md:grid-cols-[minmax(200px,300px)_1fr] md:p-7"></section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/pelicula.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
